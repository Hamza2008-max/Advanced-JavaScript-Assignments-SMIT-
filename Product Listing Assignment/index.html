<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StepUp Shoes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header class="site-header">
        <nav class="container navbar navbar-dark">
            <a class="navbar-brand fw-bold" href="#">StepUp Shoes</a>
            <span class="bag-label">Shopping bag: <span id="cart-count">0</span></span>
        </nav>
    </header>

    <main class="container py-4 py-md-5">
        <section class="welcome mb-4">
            <h1>Find your next favorite pair.</h1>
            <p>Comfortable shoes for every day and every adventure.</p>
        </section>

        <section aria-label="Shoes">
            <div class="d-flex flex-wrap align-items-center justify-content-between gap-2 mb-3">
                <h2 class="section-title mb-0">All shoes</h2>
                <p class="text-secondary mb-0" id="result-count" aria-live="polite"></p>
            </div>

            <div class="row g-4">
                <aside class="col-lg-3">
                    <div class="filter-panel">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h3 class="filter-title mb-0">Filter shoes</h3>
                            <button class="btn btn-sm clear-button" id="clear-filters" type="button">Clear</button>
                        </div>

                        <label class="form-label" for="search-input">Search</label>
                        <input class="form-control mb-3" id="search-input" type="search" placeholder="Search shoes">

                        <label class="form-label" for="category-filter">Category</label>
                        <select class="form-select mb-3" id="category-filter">
                            <option value="all">All categories</option>
                            <option value="Sneakers">Sneakers</option>
                            <option value="Running">Running</option>
                            <option value="Casual">Casual</option>
                            <option value="Formal">Formal</option>
                        </select>

                        <div class="d-flex justify-content-between">
                            <label class="form-label" for="price-filter">Maximum price</label>
                            <output id="price-output" for="price-filter">$200</output>
                        </div>
                        <input class="form-range" id="price-filter" type="range" min="20" max="200" step="5" value="200">
                        <div class="range-labels"><span>$20</span><span>$200</span></div>

                        <label class="form-label mt-3" for="sort-filter">Sort by</label>
                        <select class="form-select" id="sort-filter">
                            <option value="featured">Featured</option>
                            <option value="price-low">Price: low to high</option>
                            <option value="price-high">Price: high to low</option>
                            <option value="name">Name: A to Z</option>
                        </select>
                    </div>
                </aside>

                <div class="col-lg-9">
                    <div class="product-grid" id="product-grid" aria-live="polite"></div>
                    <div class="empty-state d-none" id="empty-state">
                        <h3>No shoes found</h3>
                        <p>Try a different search or clear the filters.</p>
                        <button class="btn btn-accent" id="empty-clear" type="button">Clear filters</button>
                    </div>
                </div>
            </div>
        </section>

        <footer class="site-footer mt-5 pt-3">
            <span>StepUp Shoes</span>
            <span>Thanks for stopping by!</span>
        </footer>
    </main>
</body>
</html>
